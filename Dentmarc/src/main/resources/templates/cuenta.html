<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Cuenta - Dentmarc</title>
    <link rel="stylesheet" href="../static/styles.css" th:href="@{/styles.css}">
</head>
<body class="fondo-claro">
<header th:replace="~{fragmentos :: encabezado}"></header>

<main class="contenedor-principal">
    <div class="cuenta-header">
        <div>
            <p class="ruta">Inicio / Mi cuenta</p>
            <h1 id="account-welcome">Mi cuenta</h1>
            <p class="texto-suave">Consulta los datos de tu cuenta Dentmarc.</p>
        </div>
        <button id="logout-button" class="btn-outline" type="button">Cerrar sesión</button>
    </div>
    <p id="account-message" class="auth-ayuda" aria-live="polite" hidden></p>

    <div class="grid-resumen-cuenta">
        <section class="tarjeta-cuenta">
            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div id="account-initials" style="width: 50px; height: 50px; background: #E6F5F6; color: var(--color-primario); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem;">DM</div>
                <div>
                    <h3 id="account-name" style="margin: 0;">Cargando perfil...</h3>
                    <p id="account-practice" style="margin: 0; font-size: 0.85rem; color: var(--color-primario);"></p>
                </div>
            </div>
            <p id="account-email" style="margin: 5px 0; font-size: 0.9rem;"></p>
            <p id="account-phone" style="margin: 5px 0 15px 0; font-size: 0.9rem;"></p>
        </section>
        <section class="tarjeta-cuenta">
            <h2>Pedidos</h2>
            <p class="texto-suave">El historial de pedidos estará disponible cuando se implemente el módulo de compras.</p>
        </section>
    </div>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
<script th:src="@{/storefront-account.js}" defer></script>
</body>
</html>
