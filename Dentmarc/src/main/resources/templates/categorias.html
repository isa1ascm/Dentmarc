<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumibles - Dentmarc</title>
    <link rel="stylesheet" href="../static/styles.css" th:href="@{/styles.css}">
</head>
<body class="fondo-claro">
<header th:replace="~{fragmentos :: encabezado}"></header>

<main class="contenedor-principal">
    <div style="margin: 20px 0 30px 0;">
        <p class="ruta"><a th:href="@{/inicio}">Inicio</a> / Categorías</p>
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
            <div style="width: 50px; height: 50px; background: var(--color-primario); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">📦</div>
            <h1 id="category-heading" style="font-size: 2rem; margin: 0; color: var(--color-secundario);">Catálogo por categorías</h1>
        </div>
        <p class="texto-suave">Explora los productos disponibles en cada categoría.</p>
    </div>

    <div id="api-categories" class="pildoras-nav" aria-label="Categorías">
        <span class="pildora">Cargando categorías...</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.9rem;">
        <p><strong id="product-count">0</strong> productos disponibles</p>
        <select id="product-sort" style="padding: 5px; border-radius: 4px; border: 1px solid var(--color-borde); color: var(--color-secundario);">
            <option value="relevance">Relevancia</option>
            <option value="price-asc">Menor a mayor precio</option>
            <option value="price-desc">Mayor a menor precio</option>
        </select>
    </div>

    <div class="layout-catalogo catalogo-sin-filtros">
        <p id="catalog-message" class="auth-ayuda" aria-live="polite" hidden></p>
        <section id="api-products" class="grilla-productos" aria-live="polite">
            <p class="texto-suave">Cargando catálogo...</p>
        </section>
    </div>
</main>

<dialog id="product-detail" class="product-detail-dialog">
    <button id="product-detail-close" type="button" aria-label="Cerrar detalle">×</button>
    <h2 id="product-detail-name"></h2>
    <p id="product-detail-brand"></p>
    <p id="product-detail-category"></p>
    <p>SKU: <span id="product-detail-sku"></span></p>
    <p>Precio: <strong id="product-detail-price"></strong></p>
    <p id="product-detail-stock"></p>
</dialog>
<footer th:replace="~{fragmentos :: pie}"></footer>
<script th:src="@{/storefront-catalog.js}" defer></script>
</body>
</html>
