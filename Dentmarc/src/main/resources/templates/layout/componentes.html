<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dentmarc - componentes del panel</title>
</head>
<body>
<!-- Etiqueta de estado de un producto (Activo / Stock bajo / Agotado) -->
<span th:fragment="badgeEstado(estado)"
      th:class="'badge-status ' + (${estado.name() == 'ACTIVO'} ? 'badge-active' : (${estado.name() == 'STOCK_BAJO'} ? 'badge-warning' : 'badge-danger'))"
      th:text="${estado.name() == 'ACTIVO'} ? '• Activo' : (${estado.name() == 'STOCK_BAJO'} ? '• Stock bajo' : '• Agotado')">• Activo</span>
</body>
</html>
