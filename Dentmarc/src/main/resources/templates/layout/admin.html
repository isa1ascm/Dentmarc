<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(titulo, contenido, activa, estilo, seccion, pagina)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${titulo}">Dentmarc - Panel administrador</title>

    <link rel="stylesheet" th:href="@{/sidebar.css}">
    <link rel="stylesheet" th:href="@{/{estilo}.css(estilo=${estilo})}">
    <link rel="stylesheet" th:href="@{/admin-forms.css}">

    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
<div class="admin-layout">

    <!-- BARRA LATERAL (SIDEBAR) REUTILIZABLE -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="logo-box">
                <i class="fa-solid fa-tooth logo-icon"></i>
            </div>
            <div class="brand-title">
                <span class="brand-name">Dentmarc</span>
                <span class="brand-sub">Depósito Dental</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a th:href="@{/admin/resumen}" class="nav-item" th:classappend="${activa == 'resumen'} ? 'active'">
                <i class="fa-solid fa-border-all"></i>
                <span>Resumen</span>
            </a>
            <a th:href="@{/admin/productos}" class="nav-item" th:classappend="${activa == 'productos'} ? 'active'">
                <i class="fa-solid fa-box"></i>
                <span>Productos</span>
            </a>
            <a th:href="@{/admin/inventario}" class="nav-item" th:classappend="${activa == 'inventario'} ? 'active'">
                <i class="fa-solid fa-cubes"></i>
                <span>Inventario</span>
            </a>
            <a th:href="@{/admin/categorias}" class="nav-item" th:classappend="${activa == 'categorias'} ? 'active'">
                <i class="fa-solid fa-tags"></i>
                <span>Categorías</span>
            </a>
            <a th:href="@{/admin/clientes}" class="nav-item" th:classappend="${activa == 'clientes'} ? 'active'">
                <i class="fa-solid fa-users"></i>
                <span>Clientes</span>
            </a>

            <div class="nav-section-title">ADMINISTRACIÓN</div>

            <a th:href="@{/admin/usuarios}" class="nav-item" th:classappend="${activa == 'usuarios'} ? 'active'">
                <i class="fa-solid fa-user-shield"></i>
                <span>Usuarios y roles</span>
            </a>
        </nav>

        <!-- ADMINISTRADOR EN SESION -->
        <div class="sidebar-profile" th:if="${adminActual != null}">
            <div class="avatar-box"
                 th:text="${#strings.toUpperCase(#strings.substring(adminActual.nombre, 0, 1) + #strings.substring(adminActual.apellidos, 0, 1))}">AM</div>
            <div class="profile-info">
                <span class="profile-name" th:text="${adminActual.nombre + ' ' + adminActual.apellidos}">Ana Martínez</span>
                <span class="profile-role">Administrador</span>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="admin-main">
        <header class="main-header">
            <div class="breadcrumb">
                <span th:text="${seccion}">General</span> / <strong class="current" th:text="${pagina}">Resumen</strong>
            </div>
            <div class="header-actions">
                <div class="sync-status">
                    <span class="status-dot green"></span>
                    <span>Sesión activa</span>
                </div>
                <!-- CIERRE DE SESION (POST con token CSRF) -->
                <form th:action="@{/admin/logout}" method="post" class="form-salir">
                    <button type="submit" class="btn-icon-nav" aria-label="Cerrar sesión" title="Cerrar sesión">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </form>
            </div>
        </header>

        <!-- MENSAJES DE EXITO Y ERROR -->
        <div class="alerta alerta-exito" th:if="${mensaje}">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${mensaje}">Operación realizada</span>
        </div>
        <div class="alerta alerta-error" th:if="${error}">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span th:text="${error}">Ocurrió un error</span>
        </div>

        <th:block th:replace="${contenido}">Contenido de la página</th:block>
    </main>
</div>
</body>
</html>
