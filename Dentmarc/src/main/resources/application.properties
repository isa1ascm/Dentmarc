spring.application.name=Dentmarc

# ==========================================
# BASE DE DATOS (MySQL)
# ==========================================
# TIP: cambia el usuario/contrasenia con las variables DB_USERNAME y DB_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/dentmarcdb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:itson}

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# JWT para la API REST. Sobrescribe JWT_SECRET en entornos compartidos o de produccion.
app.jwt.secret=${JWT_SECRET:dentmarc-local-development-secret-change-before-deploy-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
