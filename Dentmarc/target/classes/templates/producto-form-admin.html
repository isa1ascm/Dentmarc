<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::div.contenido}, 'productos', 'productos-admin', 'Catálogo', 'Productos')}">
<head>
    <title>Dentmarc - Formulario de producto</title>
</head>
<body>
<div class="contenido">

    <section class="dashboard-title-bar">
        <div>
            <h1 th:text="${producto.id == null} ? 'Crear producto' : 'Editar producto'">Crear producto</h1>
            <p class="subtitle">El estado (activo, stock bajo o agotado) se calcula automáticamente con la cantidad.</p>
        </div>
    </section>

    <!-- MISMO FORMULARIO PARA CREAR Y EDITAR -->
    <section class="form-card">
        <form th:action="${producto.id == null} ? @{/admin/productos/nuevo} : @{/admin/productos/editar/{id}(id=${producto.id})}" method="post">
            <div class="form-grid">
                <div class="form-field completo">
                    <label for="nombre">Nombre del producto</label>
                    <input type="text" id="nombre" name="nombre" th:value="${producto.nombre}" placeholder="Resina universal Filtek Z350 XT" required>
                </div>

                <div class="form-field">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" name="marca" th:value="${producto.marca}" placeholder="3M" required>
                </div>

                <div class="form-field">
                    <label for="sku">SKU</label>
                    <input type="text" id="sku" name="sku" th:value="${producto.SKU}" placeholder="RES-3M-0350" required>
                </div>

                <div class="form-field">
                    <label for="idCategoria">Categoría</label>
                    <select id="idCategoria" name="idCategoria" required>
                        <option value="">Selecciona una categoría</option>
                        <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nombre}"
                                th:selected="${idCategoriaSeleccionada != null and idCategoriaSeleccionada == categoria.id}">Restauración</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="precio">Precio (MXN)</label>
                    <input type="number" id="precio" name="precio" th:value="${producto.precio}" min="0" step="0.01" placeholder="1289.00" required>
                </div>

                <div class="form-field">
                    <label for="cantidad">Cantidad en stock</label>
                    <input type="number" id="cantidad" name="cantidad" th:value="${producto.cantidad}" min="0" step="1" required>
                    <small>Para entradas y salidas usa el módulo de Inventario.</small>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary-admin">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Guardar producto</span>
                </button>
                <a th:href="@{/admin/productos}" class="btn-secondary-admin">Cancelar</a>
            </div>
        </form>
    </section>

</div>
</body>
</html>
