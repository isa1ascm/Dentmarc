<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::div.contenido}, 'usuarios', 'productos-admin', 'Administración', 'Usuarios y roles')}">
<head>
    <title>Dentmarc - Formulario de usuario</title>
</head>
<body>
<div class="contenido">

    <section class="dashboard-title-bar">
        <div>
            <h1 th:text="${usuario.id == null} ? 'Crear usuario' : 'Editar usuario'">Crear usuario</h1>
            <p class="subtitle">Solo los usuarios con rol Administrador pueden entrar a este panel.</p>
        </div>
    </section>

    <!-- MISMO FORMULARIO PARA CREAR Y EDITAR -->
    <section class="form-card">
        <form th:action="${usuario.id == null} ? @{/admin/usuarios/nuevo} : @{/admin/usuarios/editar/{id}(id=${usuario.id})}" method="post">
            <div class="form-grid">
                <div class="form-field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" th:value="${usuario.nombre}" placeholder="Mariana" required>
                </div>

                <div class="form-field">
                    <label for="apellidos">Apellidos</label>
                    <input type="text" id="apellidos" name="apellidos" th:value="${usuario.apellidos}" placeholder="López García" required>
                </div>

                <div class="form-field">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" th:value="${usuario.email}" placeholder="usuario@dentmarc.mx"
                           th:readonly="${usuario.id != null}" required>
                    <small th:if="${usuario.id != null}">El correo no se puede modificar.</small>
                </div>

                <div class="form-field">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" th:value="${usuario.telefono}" placeholder="55 1234 5678" required>
                </div>

                <div class="form-field">
                    <label for="tipoPractica">Tipo de práctica</label>
                    <select id="tipoPractica" name="tipoPractica" required>
                        <option th:each="practica : ${practicas}" th:value="${practica.name()}"
                                th:text="${#strings.capitalize(#strings.toLowerCase(practica.name()))}"
                                th:selected="${usuario.tipoPractica != null and usuario.tipoPractica == practica}">Clinica</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option th:each="rol : ${roles}" th:value="${rol.name()}"
                                th:text="${rol.name() == 'ADMINISTRADOR'} ? 'Administrador' : 'Cliente'"
                                th:selected="${usuario.rol != null and usuario.rol == rol}">Administrador</option>
                    </select>
                </div>

                <div class="form-field completo">
                    <label for="contrasenia" th:text="${usuario.id == null} ? 'Contraseña' : 'Nueva contraseña (opcional)'">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" placeholder="Mínimo 8 caracteres"
                           pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}" th:required="${usuario.id == null}">
                    <small>Usa mayúsculas, números y un carácter especial. Se guarda cifrada con BCrypt.</small>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary-admin">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Guardar usuario</span>
                </button>
                <a th:href="@{/admin/usuarios}" class="btn-secondary-admin">Cancelar</a>
            </div>
        </form>
    </section>

</div>
</body>
</html>
