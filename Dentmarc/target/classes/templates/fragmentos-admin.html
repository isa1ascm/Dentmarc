<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Dentmarc - fragmentos del panel de administración</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>

<body>
<!-- Menu lateral compartido del panel de administracion. Uso: ~{fragmentos-admin :: menu-admin('pedidos')} -->
<aside th:fragment="menu-admin(activo)" class="admin-sidebar">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-resumen" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
        <symbol id="i-productos" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
        <symbol id="i-inventario" viewBox="0 0 24 24"><path d="M12 3l4 2.3v4.4L12 12 8 9.7V5.3zM6 12l4 2.3v4.4L6 21l-4-2.3v-4.4zM18 12l4 2.3v4.4L18 21l-4-2.3v-4.4z"/></symbol>
        <symbol id="i-categorias" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8zM7.5 8.5h.01"/></symbol>
        <symbol id="i-pedidos" viewBox="0 0 24 24"><path d="M3 4h2.5l2.4 11h10.2L20 7H7M9.5 20h.01M17 20h.01"/></symbol>
        <symbol id="i-clientes" viewBox="0 0 24 24"><path d="M9 11a4 4 0 100-8 4 4 0 000 8zM2 21v-1a6 6 0 0112 0v1M16 3.5a4 4 0 010 7M18 14a6 6 0 014 6v1"/></symbol>
        <symbol id="i-config" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15l1.6 1.3-2 3.4-2-.7a8 8 0 01-1.7 1l-.4 2.1H9.1l-.4-2.1a8 8 0 01-1.7-1l-2 .7-2-3.4L4.6 15a8 8 0 010-2L3 11.7l2-3.4 2 .7a8 8 0 011.7-1l.4-2.1h4.2l.4 2.1a8 8 0 011.7 1l2-.7 2 3.4-1.6 1.3a8 8 0 010 2z"/></symbol>
        <symbol id="i-usuarios" viewBox="0 0 24 24"><path d="M14 7a3 3 0 11-6 0 3 3 0 016 0zM4 21v-2a5 5 0 015-5h2M15 17l2 2 4-4"/></symbol>
        <symbol id="i-registro" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.5 2.8L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
    </svg>
    <div class="sidebar-header">
        <div class="logo-box">🦷</div>
        <div>
            <span class="brand-name">Dentmarc</span>
            <span class="brand-sub">Depósito dental</span>
        </div>
    </div>
    <nav class="sidebar-nav" aria-label="Panel de administración">
        <a href="/admin/resumen" class="nav-item" th:classappend="${activo == 'resumen'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-resumen"/></svg><span>Resumen</span></a>
        <a href="/admin/productos" class="nav-item" th:classappend="${activo == 'productos'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-productos"/></svg><span>Productos</span></a>
        <a href="/admin/inventario" class="nav-item" th:classappend="${activo == 'inventario'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-inventario"/></svg><span>Inventario</span></a>
        <a href="/admin/categorias" class="nav-item" th:classappend="${activo == 'categorias'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-categorias"/></svg><span>Categorías</span></a>
        <a href="/admin/pedidos" class="nav-item" th:classappend="${activo == 'pedidos'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-pedidos"/></svg><span>Pedidos</span></a>
        <a href="/admin/clientes" class="nav-item" th:classappend="${activo == 'clientes'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-clientes"/></svg><span>Clientes</span></a>
        <p class="nav-section-title">ADMINISTRACIÓN</p>
        <a href="/admin/configuracion" class="nav-item" th:classappend="${activo == 'configuracion'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-config"/></svg><span>Configuración</span></a>
        <a href="/admin/usuarios" class="nav-item" th:classappend="${activo == 'usuarios'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-usuarios"/></svg><span>Usuarios y roles</span></a>
        <a href="/admin/actividad" class="nav-item" th:classappend="${activo == 'actividad'} ? 'active'"><svg class="icono" viewBox="0 0 24 24"><use href="#i-registro"/></svg><span>Registro de actividad</span></a>
    </nav>
    <div class="sidebar-profile">
        <div class="avatar-box">AM</div>
        <div class="profile-info">
            <span class="profile-name">Ana Martínez</span>
            <span class="profile-role">Superadministradora</span>
        </div>
        <a href="/logout" class="profile-more" aria-label="Cerrar sesión">•••</a>
    </div>
</aside>
</body>

</html>
